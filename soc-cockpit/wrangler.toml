name = "soc-cockpit"
main = ".open-next/worker.js"
compatibility_date = "2026-07-09"
compatibility_flags = ["nodejs_compat"]

services = [{ binding = "ASGUARD", service = "asguard-interceptor" }]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
SUPABASE_URL = ""
SUPABASE_SERVICE_ROLE_KEY = ""
NEXT_PUBLIC_SUPABASE_ANON_KEY = ""
ASGUARD_API_KEY = ""
ASGUARD_INTERCEPTOR_URL = ""
COCKPIT_INGEST_URL = ""
DEEPSEEK_BASE_URL = "https://api.deepseek.com/v1"
DEEPSEEK_MODEL = "deepseek-chat"
ASGUARD_JWT_SECRET = ""
AXIM_SERVICE_TOKEN = ""
NEXT_PUBLIC_INTERCEPTOR_URL = ""
ONYX_AGENT_ENDPOINT = ""
