name = "asguard-interceptor"
main = "src/index.ts"
compatibility_date = "2026-09-17"
compatibility_flags = ["nodejs_compat"]

# Bind a KV Namespace for the Global Blocklist
kv_namespaces = [
  { binding = "ASGUARD_BLACKLIST", id = "53ed082bcd0f465c94f08626c97160ca" },
  { binding = "ASGUARD_TELEMETRY", id = "9141c0fd3eb44d3c84375f418c716495" }
]

[observability]
enabled = true
head_sampling_rate = 1

[vars]
# Ensure environment variable placeholders exist
ASGUARD_API_KEY = ""
ASGUARD_SERVICE_TOKEN = ""
TELEMETRY_INGEST_KEY = ""
DEEPSEEK_API_KEY = ""
ANTHROPIC_API_KEY = ""
DEEPSEEK_BASE_URL = ""
DEEPSEEK_MODEL = ""
AXIM_SERVICE_ROLE_KEY = ""
